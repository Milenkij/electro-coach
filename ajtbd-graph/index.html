<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AJTBD — Граф работ фаундера</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fafaf7;
    --surface: #ffffff;
    --surface-2: #f3f4ef;
    --border: #e4e4df;
    --border-strong: #cbcbc3;
    --text: #1a1a1a;
    --text-muted: #6b6b65;
    --text-dim: #9a9a92;
    --accent: #2d6a4f;
    --accent-soft: #e8f1ec;
    --warn: #d97706;
    --warn-soft: #fef3e6;
    --us: #2d6a4f;
    --us-bg: #ecf5ef;
    --danger: #991b1b;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 2px 8px rgba(0,0,0,.04);
    --radius: 8px;
    --radius-lg: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  body { display: flex; flex-direction: column; min-height: 100vh; }

  header.top {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .brand { display: flex; flex-direction: column; }
  .brand h1 { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
  .brand .sub { font-size: 12px; color: var(--text-muted); }
  .meta { font-size: 12px; color: var(--text-dim); }
  .meta strong { color: var(--text-muted); font-weight: 500; }

  .intro {
    padding: 14px 24px;
    background: var(--surface-2);
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    color: var(--text-muted);
  }
  .intro b { color: var(--text); font-weight: 600; }

  /* Filters */
  .filters {
    padding: 12px 24px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-wrap: wrap;
    gap: 16px 24px;
    align-items: center;
  }
  .filter-group {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .filter-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-dim);
    font-weight: 500;
  }
  .chip {
    padding: 4px 10px;
    font-size: 12px;
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: 999px;
    cursor: pointer;
    color: var(--text-muted);
    transition: all 0.15s;
    user-select: none;
  }
  .chip:hover { border-color: var(--border-strong); color: var(--text); }
  .chip.active {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }
  .chip.active.zone-entry { background: var(--accent); border-color: var(--accent); }
  .chip.active.zone-retention { background: #5b8def; border-color: #5b8def; }
  .chip.active.zone-outside { background: #64748b; border-color: #64748b; }
  .chip.active.cov-full { background: var(--accent); border-color: var(--accent); }
  .chip.active.cov-partial { background: var(--warn); border-color: var(--warn); }
  .chip.active.cov-none { background: #9a9a92; border-color: #9a9a92; }

  .slider-wrap { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-muted); }
  .slider-wrap input[type="range"] { width: 120px; accent-color: var(--accent); }

  /* Layout */
  main {
    flex: 1;
    display: grid;
    grid-template-columns: 420px 1fr;
    overflow: hidden;
    min-height: 0;
  }

  .pane-works {
    background: var(--surface);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 16px 12px 40px;
  }
  .pane-detail {
    background: var(--bg);
    overflow-y: auto;
    padding: 28px 36px 60px;
  }

  .zone-group { margin-bottom: 20px; }
  .zone-heading {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    font-weight: 600;
  }
  .zone-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }
  .zone-desc {
    padding: 0 10px 8px;
    font-size: 11px;
    color: var(--text-dim);
    line-height: 1.4;
  }

  .work-card {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    margin-bottom: 8px;
    cursor: pointer;
    background: var(--surface);
    transition: all 0.15s;
    display: block;
    text-align: left;
    width: 100%;
    font: inherit;
    color: inherit;
  }
  .work-card:hover { border-color: var(--border-strong); transform: translateY(-1px); box-shadow: var(--shadow); }
  .work-card.active {
    border-color: var(--accent);
    background: var(--accent-soft);
    box-shadow: 0 0 0 3px rgba(45,106,79,.12);
  }
  .work-card.full { border-left: 3px solid var(--accent); }
  .work-card.partial { border-left: 3px solid var(--warn); }
  .work-card.none { border-left: 3px solid #cbd5e1; }

  .work-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
    margin-bottom: 6px;
  }
  .work-id {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-dim);
    letter-spacing: 0.04em;
  }
  .work-badges { display: flex; gap: 6px; align-items: center; }
  .force-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    padding: 2px 6px;
    background: var(--surface-2);
    border-radius: 4px;
    color: var(--text-muted);
  }
  .force-badge.hi { background: #fee2e2; color: #991b1b; }
  .force-badge.mid { background: #fef3e6; color: #9a3412; }
  .cov-symbol {
    font-size: 14px;
    line-height: 1;
    width: 20px;
    text-align: center;
    display: inline-block;
  }
  .cov-full { color: var(--accent); }
  .cov-partial { color: var(--warn); }
  .cov-none { color: #94a3b8; }

  .work-name { font-size: 13px; font-weight: 500; color: var(--text); line-height: 1.4; }
  .work-meta { font-size: 11px; color: var(--text-dim); margin-top: 4px; }

  /* Detail pane */
  .detail-empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    text-align: center;
    color: var(--text-dim);
    padding: 40px;
  }
  .detail-empty h2 { font-size: 16px; font-weight: 500; margin-bottom: 8px; color: var(--text-muted); }
  .detail-empty p { font-size: 13px; max-width: 440px; line-height: 1.6; }

  .detail-header { margin-bottom: 24px; }
  .detail-crumb {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 6px;
    letter-spacing: 0.04em;
  }
  .detail-title {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.01em;
    line-height: 1.3;
    margin-bottom: 12px;
  }
  .detail-tags {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }
  .tag {
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 999px;
    font-weight: 500;
  }
  .tag-force { background: var(--surface-2); color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }
  .tag-zone-entry { background: var(--accent-soft); color: var(--accent); }
  .tag-zone-retention { background: #e6ecfb; color: #1e40af; }
  .tag-zone-outside { background: #f1f5f9; color: #475569; }
  .tag-cov-full { background: var(--accent-soft); color: var(--accent); }
  .tag-cov-partial { background: var(--warn-soft); color: var(--warn); }
  .tag-cov-none { background: #f1f5f9; color: #64748b; }

  .our-role {
    background: var(--us-bg);
    border-left: 3px solid var(--us);
    padding: 12px 16px;
    border-radius: var(--radius);
    margin-bottom: 24px;
  }
  .our-role .lbl {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--accent);
    font-weight: 600;
    margin-bottom: 4px;
  }
  .our-role p { font-size: 13.5px; color: var(--text); line-height: 1.55; }

  section.block { margin-bottom: 22px; }
  .block-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    font-weight: 600;
    margin-bottom: 8px;
  }
  .block-body { font-size: 13.5px; line-height: 1.6; color: var(--text); }
  .block-body strong { font-weight: 600; }
  .block-body ul { list-style: none; padding: 0; }
  .block-body li {
    padding: 5px 0 5px 18px;
    position: relative;
  }
  .block-body li::before {
    content: "—";
    position: absolute;
    left: 0;
    color: var(--text-dim);
  }

  .when-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px;
  }
  .when-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 12px;
  }
  .when-card .lbl {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    font-weight: 600;
    margin-bottom: 4px;
  }
  .when-card p { font-size: 13px; color: var(--text); line-height: 1.5; }

  /* Solutions grid */
  .sol-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 10px;
  }
  .sol-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 11px 13px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    transition: all 0.15s;
  }
  .sol-card:hover { border-color: var(--border-strong); box-shadow: var(--shadow); }
  .sol-card.us {
    background: var(--us-bg);
    border-color: var(--us);
    border-width: 1.5px;
  }
  .sol-head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .sol-id {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    font-weight: 500;
  }
  .sol-cost {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-muted);
  }
  .sol-name { font-size: 13px; font-weight: 600; color: var(--text); }
  .sol-card.us .sol-name { color: var(--accent); }
  .sol-brief { font-size: 11.5px; color: var(--text-muted); line-height: 1.4; }
  .sol-detail { font-size: 11.5px; color: var(--text-dim); line-height: 1.45; margin-top: 2px; }

  /* BigJob hero (visible when no work selected) */
  .hero {
    background: linear-gradient(135deg, #f5f3ee 0%, #ecf5ef 100%);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 24px 28px;
    margin-bottom: 24px;
  }
  .hero .eyebrow {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--accent);
    font-weight: 600;
    margin-bottom: 8px;
  }
  .hero h2 {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.01em;
    line-height: 1.3;
    margin-bottom: 12px;
  }
  .hero .core {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 12px 14px;
    margin-top: 12px;
    font-size: 13px;
    line-height: 1.5;
  }
  .hero .core b { color: var(--accent); }
  .hero .layers { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .layer-pill {
    background: var(--surface);
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 11.5px;
    color: var(--text-muted);
    border: 1px solid var(--border);
  }

  .legend-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 8px;
    margin-bottom: 20px;
  }
  .legend-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 12px;
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }
  .legend-symbol {
    font-size: 18px;
    line-height: 1;
    margin-top: 1px;
  }
  .legend-text .lab { font-size: 12px; font-weight: 600; }
  .legend-text .desc { font-size: 11px; color: var(--text-dim); margin-top: 2px; line-height: 1.4; }

  /* Responsive */
  @media (max-width: 960px) {
    main { grid-template-columns: 1fr; }
    .pane-works { border-right: none; border-bottom: 1px solid var(--border); max-height: 50vh; }
    .pane-detail { padding: 20px; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <h1 id="title">AJTBD — Граф работ фаундера</h1>
    <span class="sub" id="subtitle">«Второй взгляд» + квартальный контракт</span>
  </div>
  <div class="meta">
    <strong>Обновлено:</strong> <span id="updated">—</span> · источник: <code style="font-size:11px">ajtbd-analysis.md</code>
  </div>
</header>

<div class="intro" id="intro"></div>

<div class="filters">
  <div class="filter-group">
    <span class="filter-label">Зоны</span>
    <div id="zone-chips" style="display:flex; gap:6px;"></div>
  </div>
  <div class="filter-group">
    <span class="filter-label">Покрытие</span>
    <div id="coverage-chips" style="display:flex; gap:6px;"></div>
  </div>
  <div class="filter-group">
    <span class="filter-label">Сила ≥</span>
    <div class="slider-wrap">
      <input type="range" id="force-slider" min="0" max="10" value="0" step="1">
      <span id="force-value">0</span>
    </div>
  </div>
  <button id="reset-btn" class="chip" style="margin-left:auto">Сбросить</button>
</div>

<main>
  <aside class="pane-works" id="pane-works"></aside>
  <section class="pane-detail" id="pane-detail"></section>
</main>

<script>
(() => {
  const state = {
    data: null,
    selectedWork: null,
    filters: {
      zones: new Set(['entry','retention','outside']),
      coverage: new Set(['full','partial','none']),
      minForce: 0
    }
  };

  const $ = (sel) => document.querySelector(sel);
  const el = (tag, cls, html) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html !== undefined) n.innerHTML = html;
    return n;
  };

  async function load() {
    const res = await fetch('data.json');
    state.data = await res.json();
    init();
  }

  function init() {
    const d = state.data;
    $('#title').textContent = d.meta.title;
    $('#subtitle').textContent = d.meta.subtitle;
    $('#updated').textContent = d.meta.updated;
    $('#intro').innerHTML = `<b>Сегмент:</b> ${d.segment}`;

    renderZoneChips();
    renderCoverageChips();
    renderWorks();
    renderEmptyDetail();

    $('#force-slider').addEventListener('input', e => {
      state.filters.minForce = parseInt(e.target.value, 10);
      $('#force-value').textContent = e.target.value;
      renderWorks();
    });
    $('#reset-btn').addEventListener('click', resetFilters);
  }

  function renderZoneChips() {
    const root = $('#zone-chips');
    root.innerHTML = '';
    Object.values(state.data.zones).forEach(z => {
      const chip = el('button', `chip zone-${z.key} active`, z.label);
      chip.addEventListener('click', () => {
        if (state.filters.zones.has(z.key)) state.filters.zones.delete(z.key);
        else state.filters.zones.add(z.key);
        chip.classList.toggle('active');
        renderWorks();
      });
      root.appendChild(chip);
    });
  }

  function renderCoverageChips() {
    const root = $('#coverage-chips');
    root.innerHTML = '';
    Object.entries(state.data.coverageLegend).forEach(([key, c]) => {
      const chip = el('button', `chip cov-${key} active`, `${c.symbol} ${c.label}`);
      chip.addEventListener('click', () => {
        if (state.filters.coverage.has(key)) state.filters.coverage.delete(key);
        else state.filters.coverage.add(key);
        chip.classList.toggle('active');
        renderWorks();
      });
      root.appendChild(chip);
    });
  }

  function resetFilters() {
    state.filters.zones = new Set(['entry','retention','outside']);
    state.filters.coverage = new Set(['full','partial','none']);
    state.filters.minForce = 0;
    $('#force-slider').value = 0;
    $('#force-value').textContent = '0';
    document.querySelectorAll('#zone-chips .chip, #coverage-chips .chip').forEach(c => c.classList.add('active'));
    renderWorks();
  }

  function works() {
    return state.data.works.filter(w =>
      state.filters.zones.has(w.zone) &&
      state.filters.coverage.has(w.coverage) &&
      w.force >= state.filters.minForce
    );
  }

  function renderWorks() {
    const root = $('#pane-works');
    root.innerHTML = '';
    const grouped = { entry: [], retention: [], outside: [] };
    works().forEach(w => grouped[w.zone].push(w));

    Object.values(state.data.zones).forEach(z => {
      const list = grouped[z.key];
      if (!list.length) return;
      const group = el('div', 'zone-group');
      const head = el('div', 'zone-heading');
      const dot = el('span', 'zone-dot');
      dot.style.background = z.color;
      head.appendChild(dot);
      head.appendChild(document.createTextNode(z.label));
      group.appendChild(head);
      group.appendChild(el('div', 'zone-desc', z.description));
      list.forEach(w => group.appendChild(workCard(w)));
      root.appendChild(group);
    });

    if (!works().length) {
      root.appendChild(el('div', '', '<p style="padding:20px;color:var(--text-dim);font-size:12px">Нет работ под текущие фильтры. Сбросьте фильтры.</p>'));
    }
  }

  function workCard(w) {
    const cov = state.data.coverageLegend[w.coverage];
    const card = el('button', `work-card ${w.coverage}${state.selectedWork === w.id ? ' active' : ''}`);
    const forceClass = w.force >= 9 ? 'hi' : w.force >= 7 ? 'mid' : '';
    card.innerHTML = `
      <div class="work-head">
        <span class="work-id">${w.id}</span>
        <div class="work-badges">
          <span class="force-badge ${forceClass}" title="Сила боли">${w.force}/10</span>
          <span class="cov-symbol cov-${w.coverage}" title="${cov.label}">${cov.symbol}</span>
        </div>
      </div>
      <div class="work-name">${w.name}</div>
      <div class="work-meta">${w.solutions.length} решений в найме</div>
    `;
    card.addEventListener('click', () => {
      state.selectedWork = w.id;
      renderWorks();
      renderDetail(w);
    });
    return card;
  }

  function renderEmptyDetail() {
    const d = state.data;
    const root = $('#pane-detail');
    root.innerHTML = '';

    const hero = el('div', 'hero');
    hero.innerHTML = `
      <div class="eyebrow">Big Job фаундера</div>
      <h2>${d.bigJob.title}</h2>
      <div style="font-size:13.5px; color:var(--text-muted); line-height:1.55;">
        ${d.bigJob.want}
      </div>
      <div class="core">
        <b>Core Job продукта (сила ${d.coreJob.force}/10):</b> ${d.coreJob.title}
        <div class="layers">${d.coreJob.layers.map(l => `<span class="layer-pill">${l}</span>`).join('')}</div>
      </div>
    `;
    root.appendChild(hero);

    const legendTitle = el('div', 'block-title', 'Как читать граф');
    root.appendChild(legendTitle);
    const legendGrid = el('div', 'legend-grid');
    Object.entries(d.coverageLegend).forEach(([key, c]) => {
      const item = el('div', 'legend-item');
      item.innerHTML = `
        <span class="legend-symbol cov-${key}">${c.symbol}</span>
        <div class="legend-text">
          <div class="lab">${c.label}</div>
          <div class="desc">${c.description}</div>
        </div>
      `;
      legendGrid.appendChild(item);
    });
    root.appendChild(legendGrid);

    const hint = el('div', 'detail-empty',
      `<h2>Выберите работу слева</h2><p>11 работ от Big Job до «лидер вернулся». Справа увидите, что нанимает фаундер на эту работу и где мы с продуктом.</p>`);
    hint.style.padding = '40px 0';
    hint.style.height = 'auto';
    root.appendChild(hint);
  }

  function renderDetail(w) {
    const d = state.data;
    const root = $('#pane-detail');
    root.innerHTML = '';

    const zone = d.zones[w.zone];
    const cov = d.coverageLegend[w.coverage];

    const header = el('div', 'detail-header');
    header.innerHTML = `
      <div class="detail-crumb">${w.id} · ${zone.label} · Сила боли ${w.force}/10</div>
      <div class="detail-title">${w.name}</div>
      <div class="detail-tags">
        <span class="tag tag-force">Сила ${w.force}/10</span>
        <span class="tag tag-zone-${w.zone}">${zone.label}</span>
        <span class="tag tag-cov-${w.coverage}">${cov.symbol} ${cov.label}</span>
      </div>
    `;
    root.appendChild(header);

    const role = el('div', 'our-role');
    role.innerHTML = `<div class="lbl">Наша роль на этой работе</div><p>${w.ourRole}</p>`;
    root.appendChild(role);

    const whenSection = el('section', 'block');
    whenSection.innerHTML = `<div class="block-title">Когда</div>`;
    const whenGrid = el('div', 'when-grid');
    const whenFields = [
      ['Контекст', w.when.context],
      ['Триггер', w.when.trigger],
      ['Эмоции в точке А', w.when.emotions]
    ];
    whenFields.forEach(([lbl, val]) => {
      const c = el('div', 'when-card');
      c.innerHTML = `<div class="lbl">${lbl}</div><p>${val}</p>`;
      whenGrid.appendChild(c);
    });
    whenSection.appendChild(whenGrid);
    root.appendChild(whenSection);

    const wantSection = el('section', 'block');
    wantSection.innerHTML = `<div class="block-title">Хочу получить</div><div class="block-body">${w.want}</div>`;
    root.appendChild(wantSection);

    const critSection = el('section', 'block');
    critSection.innerHTML = `<div class="block-title">Критерии успеха</div>
      <div class="block-body"><ul>${w.criteria.map(c => `<li>${c}</li>`).join('')}</ul></div>`;
    root.appendChild(critSection);

    const probSection = el('section', 'block');
    probSection.innerHTML = `<div class="block-title">Почему нынешние решения буксуют</div><div class="block-body">${w.problems}</div>`;
    root.appendChild(probSection);

    // Solutions
    const solsSection = el('section', 'block');
    solsSection.innerHTML = `<div class="block-title">Что нанимают на эту работу (${w.solutions.length})</div>`;
    const grid = el('div', 'sol-grid');
    w.solutions.forEach(sid => {
      const s = d.solutions.find(x => x.id === sid);
      if (!s) return;
      const card = el('div', `sol-card${s.isUs ? ' us' : ''}`);
      card.innerHTML = `
        <div class="sol-head">
          <span class="sol-id">[${s.id}]${s.isUs ? ' · нас нанимают' : ''}</span>
          <span class="sol-cost">${s.cost || ''}</span>
        </div>
        <div class="sol-name">${s.name}</div>
        <div class="sol-brief">${s.brief}</div>
        <div class="sol-detail">${s.detail}</div>
      `;
      grid.appendChild(card);
    });
    solsSection.appendChild(grid);
    root.appendChild(solsSection);

    root.scrollTop = 0;
  }

  load().catch(err => {
    $('#pane-detail').innerHTML = `<div class="detail-empty"><h2>Не смог загрузить data.json</h2><p>Открывайте страницу через локальный сервер (см. README.md): <code>python3 -m http.server 8000</code>. Ошибка: ${err.message}</p></div>`;
  });
})();
</script>
</body>
</html>
