name: Deploy bot

on:
  push:
    branches: [main]
    paths:
      - 'bot/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/electrocoach
            GIT_SSH_COMMAND="ssh -i ~/.ssh/electrocoach_deploy -o StrictHostKeyChecking=no" git pull origin main
            cd bot
            docker compose up -d --build
