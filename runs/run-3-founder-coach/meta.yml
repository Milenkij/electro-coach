notes: |
  Dyad-ран: Кирилл + Алексей (бади по проекту). Оба прогоняют
  friend-диагностику друг на друге (founder-interview обоих,
  cross-feedback). Совмещаются в единый документ constitution.md.

  Team-diagnostic — в урезанной форме: ролевая модель на двоих
  (кто за что отвечает в ране, стоп-факторы каждого). Отдельные
  интервью с подчинёнными не проводятся (нет подчинённых).

  Stage 1 не считается начатым, пока Stage 0 не закрыт артефактом
  «Конституция команды» (см. /knowledge/decisions/stage-0-gating.md).

  Lineage: пивот идёт от Run 2 (AJTBD-открытия про параллельные
  точки входа), но parent_run=null — Run 3 не наследует сегменты
  Run 2, а стартует чистым от базовой гипотезы Run 1 с новой рамкой.
