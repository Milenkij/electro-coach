hypothesis: >
  ElectroCoach применяется в двух режимах параллельно: (1) персональный
  AI-коучинг фаундера как дешёвая высокочастотная ставка и (2) групповая
  фасилитация «AI в ухе у фаундера» — сооснователи, топы, партнёры
  проходят управляемую сессию с фаундером как ведущим. Персональное
  использование — не prerequisite, а параллельная точка входа;
  «персональное в служении групповому» — возможный третий путь
  (~15% по данным Run 2 AJTBD).

